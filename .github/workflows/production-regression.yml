name: Production regression checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "production/**"]

permissions:
  contents: read

jobs:
  backend-tests:
    name: Django tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: campus-rep-portal
    env:
      SECRET_KEY: campuspulse-ci-test-secret-key
      DEBUG: "True"
      VAPID_PRIVATE_KEY: ci-placeholder-private-key
      VAPID_PUBLIC_KEY: ci-placeholder-public-key
      CLOUDINARY_CLOUD_NAME: ci-placeholder
      CLOUDINARY_API_KEY: "000000000000000"
      CLOUDINARY_API_SECRET: ci-placeholder-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: campus-rep-portal/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Run Django system checks
        run: python manage.py check
      - name: Check migration state
        run: python manage.py makemigrations --check --dry-run
      - name: Run backend regression tests
        run: python manage.py test accounts attendance --verbosity 2

  frontend-build:
    name: Frontend production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: campus-rep-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: campus-rep-frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Lint frontend
        run: npm run lint
